<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#112840">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="logo-square.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ottley Secretariat</title>
  <link rel="icon" href="logo-square.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="top-name">Ottley Secretariat</span>
    <button id="btn-lang" class="chip" type="button" aria-label="Language"></button>
  </header>

  <main class="wrap">
    <section id="view-boot" class="card center" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
    </section>

    <section id="view-login" class="card center" hidden>
      <img class="logo" src="logo-wide.png" alt="Ottley Secretariat">
      <div class="rule"></div>
      <h1 data-i18n="login_title"></h1>
      <p class="muted" data-i18n="login_sub"></p>
      <div id="gbtn" class="gbtn"></div>
      <p id="login-msg" class="msg" role="status"></p>
      <p class="tiny" data-i18n="login_note"></p>
    </section>

    <div id="view-app" hidden>
      <section class="card who-card">
        <div class="who">
          <img id="who-pic" class="avatar" alt="" hidden>
          <div class="grow">
            <div id="who-name" class="who-name"></div>
            <div id="who-email" class="muted small"></div>
          </div>
          <button id="btn-refresh" class="btn ghost sm" type="button" data-i18n="btn_refresh"></button>
          <button id="btn-logout" class="btn ghost sm" type="button" data-i18n="btn_logout"></button>
        </div>
      </section>

      <p id="app-msg" class="msg" role="status"></p>

      <section class="card">
        <h2 data-i18n="agenda_title"></h2>
        <p class="muted small" data-i18n="agenda_sub"></p>
        <div class="rule left"></div>
        <div id="agenda"></div>
      </section>

      <section class="card">
        <h2 data-i18n="surat_title"></h2>
        <p class="muted small" data-i18n="surat_sub"></p>
        <div class="rule left"></div>
        <div id="surat"></div>
      </section>

      <section class="card">
        <h2 data-i18n="conn_title"></h2>
        <dl id="conn" class="rows"></dl>
      </section>
    </div>
  </main>
</body>
</html>
