<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#14263a">
  <meta name="app-v" content="19">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="logo-square.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ottley Secretariat</title>
  <link rel="icon" href="logo-square.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <button id="btn-menu" class="menu-btn" type="button" aria-label="Menu" aria-controls="nav" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="top-name">Ottley Secretariat</span>
    <span id="top-tab" class="top-tab" aria-live="polite"></span>
    <button id="btn-lang" class="chip" type="button" aria-label="Language"></button>
  </header>

  <div id="nav-ov" class="nav-ov" hidden></div>
  <nav id="nav" class="nav" aria-label="Menu" hidden>
    <div class="nav-brand">
      <img src="logo-square.png" alt="" width="44" height="44">
      <div><div class="nav-name">Ottley Secretariat</div><div class="nav-sub">Office of Noel Ottley</div></div>
    </div>
    <button class="tab on" type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9"/></svg><span data-i18n="tab_home"></span></button>
    <button class="tab" type="button" data-tab="jadwal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-i18n="tab_jadwal"></span></button>
    <button class="tab" type="button" data-tab="meeting"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="1.5"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/></svg><span data-i18n="tab_meeting"></span></button>
    <button class="tab" type="button" data-tab="todo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span data-i18n="tab_todo"></span></button>
    <button class="tab" type="button" data-tab="kelas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5zM7 11.5V16c0 1.2 2.2 3 5 3s5-1.8 5-3v-4.5"/></svg><span data-i18n="tab_kelas"></span></button>
    <button class="tab" type="button" data-tab="amb"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6M17 5l2-2M19 9h2"/></svg><span data-i18n="tab_amb"></span></button>
    <button class="tab" type="button" data-tab="surat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 7l9 7 9-7"/></svg><span data-i18n="tab_surat"></span></button>
    <button class="tab" type="button" data-tab="kontak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h14a2 2 0 012 2v12H6a2 2 0 01-2-2zM20 8h1M20 12h1M20 16h1M12 11.5a2 2 0 100-4 2 2 0 000 4zM8.5 16c.5-2 2-3 3.5-3s3 1 3.5 3"/></svg><span data-i18n="tab_kontak"></span></button>
    <button class="tab" type="button" data-tab="catatan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg><span data-i18n="tab_catatan"></span></button>
  </nav>

  <main class="wrap">
    <section id="view-boot" class="boot" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
    </section>

    <section id="view-login" class="login" hidden>
      <div class="login-band" aria-hidden="true"></div>
      <div class="login-body">
        <img class="logo" src="logo-wide.png" alt="Ottley Secretariat">
        <h1 data-i18n="login_title"></h1>
        <p class="lede" data-i18n="login_sub"></p>
        <div id="gbtn" class="gbtn"></div>
        <p id="login-msg" class="msg" role="status"></p>
        <p class="tiny" data-i18n="login_note"></p>
      </div>
    </section>

    <div id="view-app" hidden>
      <div class="who">
        <img id="who-pic" class="avatar" alt="" hidden>
        <div class="grow">
          <div id="who-name" class="who-name"></div>
          <div id="who-email" class="who-email"></div>
        </div>
        <button id="btn-refresh" class="lnk" type="button" data-i18n="btn_refresh"></button>
        <button id="btn-logout" class="lnk" type="button" data-i18n="btn_logout"></button>
      </div>

      <p id="app-msg" class="msg" role="status"></p>

      <div id="tab-home">
        <div class="hero">
          <div id="hero-date" class="eyebrow"></div>
          <h1 id="hero-hello" class="hello"></h1>
          <p id="hero-sum" class="lede"></p>
        </div>
        <div class="cols">
          <section class="block">
            <h2 data-i18n="agenda_title"></h2>
            <p class="sub" data-i18n="agenda_sub"></p>
            <div id="agenda"></div>
          </section>
          <section class="block">
            <h2 data-i18n="surat_title"></h2>
            <p class="sub" data-i18n="surat_sub"></p>
            <div id="surat"></div>
          </section>
        </div>
        <details id="sys" class="sys">
          <summary data-i18n="conn_title"></summary>
          <dl id="conn" class="rows"></dl>
        </details>
      </div>

      <div id="tab-jadwal" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="jadwal_title"></h1><p class="lede" data-i18n="jadwal_sub"></p></div>
            <button id="j-add" class="btn primary" type="button" data-i18n="j_add"></button>
          </div>
          <form id="qa" class="qa" autocomplete="off">
            <input id="qa-in" type="text" maxlength="300" data-i18n-ph="qa_ph" aria-label="Quick add">
            <button id="qa-go" class="btn ghost" type="submit" data-i18n="qa_go"></button>
          </form>
          <p id="qa-msg" class="tiny tight" role="status"></p>
        </div>
        <div class="viewbar" role="tablist">
          <button class="vb" type="button" data-view="list" data-i18n="view_list"></button>
          <button class="vb" type="button" data-view="day" data-i18n="view_day"></button>
          <button class="vb" type="button" data-view="3day" data-i18n="view_3day"></button>
          <button class="vb" type="button" data-view="week" data-i18n="view_week"></button>
          <button class="vb" type="button" data-view="month" data-i18n="view_month"></button>
        </div>
        <p id="j-msg" class="msg" role="status"></p>
        <div id="j-listview">
          <div class="seg" role="tablist">
            <button class="seg-b on" type="button" data-scope="upcoming" data-i18n="scope_upcoming"></button>
            <button class="seg-b" type="button" data-scope="past" data-i18n="scope_past"></button>
            <button class="seg-b" type="button" data-scope="cancelled" data-i18n="scope_cancelled"></button>
          </div>
          <div id="j-list"></div>
        </div>
        <div id="j-calview" hidden>
          <div class="cal-nav">
            <button id="cal-prev" class="btn ghost sm" type="button" aria-label="Sebelumnya">‹</button>
            <button id="cal-next" class="btn ghost sm" type="button" aria-label="Berikutnya">›</button>
            <button id="cal-today" class="btn ghost sm" type="button" data-i18n="cal_today"></button>
            <div id="cal-label" class="cal-label"></div>
          </div>
          <div id="cal"></div>
        </div>
      </div>


      <div id="tab-catatan" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="catatan_title"></h1><p class="lede" data-i18n="catatan_sub"></p></div>
            <button id="n-add" class="btn primary" type="button" data-i18n="n_add"></button>
          </div>
        </div>
        <label class="fl search"><span data-i18n="n_search"></span><input id="n-q" type="search" maxlength="100"></label>
        <div id="n-tags" class="chips tagbar"></div>
        <p id="n-msg" class="msg" role="status"></p>
        <div id="n-list"></div>
      </div>

      <div id="tab-kelas" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="kelas_title"></h1><p class="lede" data-i18n="kelas_sub"></p></div>
            <div class="bar tight"><button id="k-add" class="btn primary" type="button" data-i18n="k_add"></button><button id="k-libur" class="btn ghost" type="button" data-i18n="k_libur"></button></div>
          </div>
        </div>
        <p id="k-msg" class="msg" role="status"></p>
        <div id="k-list"></div>
      </div>

      <div id="tab-meeting" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="meet_title"></h1><p class="lede" data-i18n="meet_sub"></p></div>
            <button id="m-add" class="btn primary" type="button" data-i18n="m_add"></button>
          </div>
        </div>
        <div class="seg" role="tablist">
          <button class="seg-a on" type="button" data-mscope="upcoming" data-i18n="scope_upcoming"></button>
          <button class="seg-a" type="button" data-mscope="past" data-i18n="scope_past"></button>
          <button class="seg-a" type="button" data-mscope="cancelled" data-i18n="scope_cancelled"></button>
        </div>
        <p id="m-msg" class="msg" role="status"></p>
        <div id="m-list"></div>
      </div>
      <div id="tab-todo" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="todo_title"></h1><p class="lede" data-i18n="todo_sub"></p></div>
            <button id="td-add" class="btn primary" type="button" data-i18n="td_add"></button>
          </div>
          <form id="td-quick" class="qa" autocomplete="off">
            <input id="td-q" type="text" maxlength="200" data-i18n-ph="td_ph" aria-label="To-do">
            <button class="btn ghost" type="submit" data-i18n="td_quick"></button>
          </form>
        </div>
        <div class="seg" role="tablist">
          <button class="seg-a on" type="button" data-tscope="today" data-i18n="td_today"></button>
          <button class="seg-a" type="button" data-tscope="all" data-i18n="td_all"></button>
          <button class="seg-a" type="button" data-tscope="done" data-i18n="td_done"></button>
        </div>
        <p id="td-msg" class="msg" role="status"></p>
        <div id="td-list"></div>
      </div>
      <div id="tab-amb" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="amb_title"></h1><p class="lede" data-i18n="amb_sub"></p></div>
            <button id="a-add" class="btn primary" type="button" data-i18n="a_add"></button>
          </div>
        </div>
        <div class="seg" role="tablist">
          <button class="seg-a on" type="button" data-ascope="upcoming" data-i18n="scope_upcoming"></button>
          <button class="seg-a" type="button" data-ascope="past" data-i18n="scope_past"></button>
          <button class="seg-a" type="button" data-ascope="cancelled" data-i18n="scope_cancelled"></button>
        </div>
        <p id="a-msg" class="msg" role="status"></p>
        <div id="a-list"></div>
      </div>

      <div id="tab-kontak" hidden>
        <div class="hero">
          <div class="head-row">
            <div class="grow"><h1 class="hello" data-i18n="tab_kontak"></h1><p class="lede" data-i18n="kontak_sub"></p></div>
            <button id="c-add" class="btn primary" type="button" data-i18n="c_add"></button>
          </div>
        </div>
        <label class="fl"><span data-i18n="c_search"></span><input id="c-q" type="search" autocomplete="off"></label>
        <p id="c-msg" class="msg" role="status"></p>
        <div id="c-list"></div>
      </div>

      <div id="tab-surat" hidden>
        <div id="s-list-view">
          <div class="hero">
            <div class="head-row">
              <div class="grow"><h1 class="hello" data-i18n="tab_surat"></h1><p class="lede" data-i18n="surat_page_sub"></p></div>
              <button id="s-write" class="btn primary" type="button" data-i18n="s_write"></button>
            </div>
          </div>
          <div id="sq-box" hidden>
            <h3 class="mini" data-i18n="sq_title"></h3>
            <div id="sq-list"></div>
          </div>
          <div id="rv-box" hidden>
            <h3 class="mini" data-i18n="rv_title"></h3>
            <div id="rv-list"></div>
          </div>
          <p id="sh-msg" class="msg" role="status"></p>
          <div id="sh-list"></div>
        </div>
        <div id="s-compose-view" hidden>
          <button id="s-back" class="lnk back" type="button" data-i18n="s_back"></button>
        <section class="card">
          <h2 data-i18n="surat_form_title"></h2>
          <p class="muted small"><span data-i18n="s_from"></span> <b id="s-sender">-</b></p>
          <p id="s-warn" class="msg err" hidden></p>
          <form id="sf" novalidate autocomplete="off">
            <label class="fl"><span data-i18n="s_to"></span><input id="s-to" type="text" inputmode="email" placeholder="nama@contoh.com"></label>
            <label class="fl"><span data-i18n="s_cc"></span><input id="s-cc" type="text" inputmode="email"></label>
            <div class="bar tight"><button id="s-contacts" class="btn ghost sm" type="button" data-i18n="s_contacts"></button></div>
            <label class="fl"><span data-i18n="s_nama"></span><input id="s-nama" type="text" maxlength="150"></label>
            <div class="grid2">
              <label class="fl"><span data-i18n="s_lang"></span><select id="s-lang"><option value="ID">Bahasa Indonesia</option><option value="EN">English</option></select></label>
              <label class="fl"><span data-i18n="s_part"></span><select id="s-part"></select></label>
            </div>
            <label class="fl"><span data-i18n="s_event"></span><select id="s-ev"></select></label>
            <p class="greet">Pembuka / Opening: <b id="s-hello">-</b><br>Penutup / Closing: <b id="s-close">-</b></p>
            <label class="fl"><span data-i18n="s_tpl"></span><select id="s-tpl"></select></label>
            <div class="grid2">
              <label class="fl"><span data-i18n="s_cardtitle"></span><input id="s-card" type="text" maxlength="80"></label>
              <label class="fl"><span data-i18n="s_maps"></span><input id="s-maps" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/..."></label>
            </div>
            <label class="fl"><span data-i18n="s_subject"></span><input id="s-subject" type="text" maxlength="300"></label>
            <label class="fl"><span data-i18n="s_body"></span><textarea id="s-body" rows="8" maxlength="8000"></textarea></label>
            <p class="tiny tight" data-i18n="s_body_hint"></p>
            <div id="s-fields"></div>
            <label class="fl"><span data-i18n="s_files"></span><textarea id="s-files" rows="2" placeholder="https://drive.google.com/file/d/.../view"></textarea></label>
            <div id="s-filelist" class="files"></div>
            <div class="fl">
              <span data-i18n="s_upload"></span>
              <div id="s-drop" class="drop">
                <button id="s-pick" class="btn ghost sm" type="button" data-i18n="s_pick"></button>
                <span class="tiny tight" data-i18n="s_drop"></span>
                <input id="s-file" type="file" multiple hidden>
              </div>
              <div id="s-ups" class="files"></div>
              <div id="s-limit" class="files"></div>
            </div>
            <div class="subj"><span data-i18n="s_subj_prev"></span> <b id="s-subj">-</b></div>
            <iframe id="s-prev" class="prev" sandbox="" title="Preview"></iframe>
            <p id="s-msg" class="msg" role="status"></p>
            <label class="chip-c"><input id="s-sched" type="checkbox"> <span data-i18n="s_sched"></span></label>
            <div id="s-sched-box" hidden>
              <div class="grid2">
                <label class="fl"><span data-i18n="s_sd"></span><input id="s-sd" type="date"></label>
                <label class="fl"><span data-i18n="s_st"></span><input id="s-st" type="time"></label>
              </div>
              <p class="tiny tight" data-i18n="s_sched_hint"></p>
            </div>
            <label class="chip-c"><input id="s-ics" type="checkbox"> <span data-i18n="s_ics"></span></label>
            <label class="chip-c"><input id="s-rsvp" type="checkbox"> <span data-i18n="s_rsvp"></span></label>
            <div id="s-rsvp-box" hidden>
              <label class="fl"><span data-i18n="s_rsvp_by"></span><input id="s-rsvp-by" type="date"></label>
              <p class="tiny tight" data-i18n="s_rsvp_hint"></p>
            </div>
            <div class="bar">
              <button id="s-test" class="btn ghost" type="button" data-i18n="s_test"></button>
              <button id="s-send" class="btn primary" type="button" data-i18n="s_send"></button>
              <button id="s-new" class="btn ghost" type="button" data-i18n="s_new" hidden></button>
            </div>
          </form>
        </section>
        </div>
      </div>
    </div>
  </main>

  <div id="sheet" class="sheet" hidden>
    <form id="jf" class="sheet-card" novalidate autocomplete="off">
      <h2 id="jf-title"></h2>
      <label class="fl"><span data-i18n="f_title"></span><input id="f-title" type="text" maxlength="200"></label>
      <div id="f-patw" class="fl"><span data-i18n="p_pattern"></span>
        <div class="seg seg-pat">
          <button class="seg-a on" type="button" data-pat="one" data-i18n="p_one"></button>
          <button class="seg-a" type="button" data-pat="multi" data-i18n="p_multi"></button>
          <button class="seg-a" type="button" data-pat="repeat" data-i18n="p_repeat"></button>
        </div>
      </div>
      <div id="f-single">
        <div class="grid3">
          <label class="fl"><span data-i18n="f_date"></span><input id="f-date" type="date"></label>
          <label class="fl"><span data-i18n="f_start"></span><input id="f-start" type="time"></label>
          <label class="fl"><span data-i18n="f_end"></span><input id="f-end" type="time"></label>
        </div>
        <p class="tiny tight" data-i18n="f_time_hint"></p>
        <p id="f-clash" class="msg warn" role="status"></p>
      </div>
      <div id="f-multi" hidden>
        <div id="f-gen" class="gen" hidden>
          <div class="fl"><span data-i18n="p_wd"></span><div id="g-wd" class="chips"></div></div>
          <div class="grid2">
            <label class="fl"><span data-i18n="p_from"></span><input id="g-from" type="date"></label>
            <label class="fl"><span data-i18n="p_to"></span><input id="g-to" type="date"></label>
          </div>
          <div class="grid2">
            <label class="fl"><span data-i18n="f_start"></span><input id="g-start" type="time"></label>
            <label class="fl"><span data-i18n="f_end"></span><input id="g-end" type="time"></label>
          </div>
          <button id="g-make" class="btn ghost sm" type="button" data-i18n="p_make"></button>
        </div>
        <div id="f-days"></div>
        <button id="f-addday" class="btn ghost sm" type="button" data-i18n="p_add"></button>
        <p id="f-mcount" class="tiny tight"></p>
      </div>
      <label class="fl"><span data-i18n="f_loc"></span><input id="f-loc" type="text" maxlength="300"></label>
      <label class="fl"><span data-i18n="f_maps"></span><input id="f-maps" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/..."></label>
      <label class="fl"><span data-i18n="f_guests"></span><textarea id="f-guests" rows="2" placeholder="nama@email.com, ..."></textarea></label>
      <div class="fl"><span data-i18n="f_rem"></span><div id="f-rem" class="chips"></div></div>
      <label class="fl"><span data-i18n="f_notes"></span><textarea id="f-notes" rows="3" maxlength="3000"></textarea></label>
      <label class="fl" id="f-statw"><span data-i18n="f_status"></span><select id="f-status"></select></label>
      <p id="jf-msg" class="msg" role="alert"></p>
      <div class="bar">
        <button id="jf-save" class="btn primary" type="submit" data-i18n="btn_save"></button>
        <button id="jf-cancel" class="btn ghost" type="button" data-i18n="btn_close"></button>
      </div>
    </form>
  </div>

  <div id="nsheet" class="sheet" hidden>
    <form id="nf" class="sheet-card" novalidate autocomplete="off">
      <h2 id="nf-title"></h2>
      <label class="fl"><span data-i18n="n_f_title"></span><input id="nf-t" type="text" maxlength="150"></label>
      <label class="fl"><span data-i18n="n_f_body"></span><textarea id="nf-b" rows="9" maxlength="10000"></textarea></label>
      <label class="fl"><span data-i18n="n_f_tags"></span><input id="nf-g" type="text" maxlength="200" placeholder="rapat, penting"></label>
      <p id="nf-msg" class="msg" role="alert"></p>
      <div class="bar">
        <button id="nf-save" class="btn primary" type="submit" data-i18n="btn_save"></button>
        <button id="nf-cancel" class="btn ghost" type="button" data-i18n="btn_close"></button>
      </div>
    </form>
  </div>

  <div id="ksheet" class="sheet" hidden>
    <form id="kf" class="sheet-card wide" novalidate autocomplete="off">
